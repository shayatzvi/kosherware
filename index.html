<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LexGuard | Data Portal</title>
    <style>
        /* KVH Aesthetic */
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f9; margin: 0; color: #333; }
        .header { background-color: #2c4273; color: white; padding: 20px; font-weight: bold; font-size: 1.5em; }
        .container { max-width: 900px; margin: 20px auto; background: white; border: 1px solid #dcdcdc; padding: 20px; }
        
        /* Tabs */
        .tabs { display: flex; border-bottom: 2px solid #dcdcdc; margin-bottom: 20px; }
        .tab { padding: 10px 20px; cursor: pointer; color: #555; }
        .tab.active { border-bottom: 3px solid #2c4273; color: #2c4273; font-weight: bold; }

        /* Forms */
        .form-group { display: flex; gap: 20px; margin-bottom: 15px; }
        .field { flex: 1; }
        label { display: block; font-size: 0.8em; color: #666; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        .action-bar { margin-top: 20px; text-align: right; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-save { background: #2c4273; color: white; }
    </style>
</head>
<body>

<div class="header">KVHWEB | YOUR KOSHER DATA PORTAL</div>

<div class="container">
    <div class="tabs">
        <div class="tab active">Contact Info</div>
        <div class="tab">Availability</div>
        <div class="tab">Background</div>
    </div>

    <div id="form-area">
        <div class="form-group">
            <div class="field"><label>Salutation</label><input type="text" id="salutation"></div>
        </div>
        <div class="form-group">
            <div class="field"><label>First Name</label><input type="text" id="fName"></div>
            <div class="field"><label>Last Name</label><input type="text" id="lName"></div>
        </div>
        <div class="form-group">
            <div class="field"><label>Phone</label><input type="text" id="phone"></div>
            <div class="field"><label>Mobile</label><input type="text" id="mobile"></div>
        </div>
        <div class="action-bar">
            <button class="btn-save" onclick="saveData()">Save Information</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = { /* PASTE YOUR CONFIG HERE */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function saveData() {
        db.collection('profiles').add({
            salutation: document.getElementById('salutation').value,
            firstName: document.getElementById('fName').value,
            lastName: document.getElementById('lName').value
        }).then(() => alert('Saved!'));
    }
</script>
</body>
</html>
