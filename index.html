<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CertTracker - Secure</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <style>
        body { padding-top: 50px; background: #f0f0f0; }
        .auth-container { max-width: 400px; margin: auto; padding: 20px; background: white; }
        .hidden { display: none; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<!-- Auth Section -->
<div id="auth-section" class="container auth-container">
    <h3>Login</h3>
    <input type="email" id="email" class="form-control" placeholder="Email"><br>
    <input type="password" id="password" class="form-control" placeholder="Password"><br>
    <button class="btn btn-primary btn-block" onclick="login()">Login</button>
</div>

<!-- App Section -->
<div id="app-section" class="container hidden">
    <h2>Certification Manager <button class="btn btn-danger btn-xs" onclick="logout()">Logout</button></h2>
    <ul class="nav nav-tabs">
        <li class="active"><a data-toggle="tab" href="#est">Establishments</a></li>
        <li><a data-toggle="tab" href="#prod">Products</a></li>
    </ul>
    <div class="tab-content">
        <div id="est" class="tab-pane fade in active">
            <br><button class="btn btn-success" data-toggle="modal" data-target="#estModal">Add Establishment</button>
            <table class="table"><thead><tr><th>Name</th><th>Location</th><th>Actions</th></tr></thead><tbody id="est-body"></tbody></table>
        </div>
        <div id="prod" class="tab-pane fade">
            <br><button class="btn btn-success" data-toggle="modal" data-target="#prodModal">Add Product</button>
            <table class="table"><thead><tr><th>Product</th><th>Status</th><th>Actions</th></tr></thead><tbody id="prod-body"></tbody></table>
        </div>
    </div>
</div>

<!-- Modals -->
<div class="modal fade" id="estModal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h4>Add Establishment</h4></div><div class="modal-body">
    <input type="text" id="eName" class="form-control" placeholder="Name"><br>
    <input type="text" id="eLoc" class="form-control" placeholder="Location">
</div><div class="modal-footer"><button class="btn btn-primary" onclick="saveEst()">Save</button></div></div></div></div>

<!-- Scripts -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAQ6srV8znv9VPXSJadwndd1r-borokbV0",
        authDomain: "lexguard-4e97d.firebaseapp.com",
        projectId: "lexguard-4e97d",
        storageBucket: "lexguard-4e97d.firebasestorage.app",
        messagingSenderId: "579400873495",
        appId: "1:579400873495:web:56f48cb7c6bd5d37bc8e52"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function login() {
        auth.signInWithEmailAndPassword($('#email').val(), $('#password').val())
            .catch(err => alert(err.message));
    }

    auth.onAuthStateChanged(user => {
        if (user) {
            $('#auth-section').addClass('hidden');
            $('#app-section').removeClass('hidden');
            loadData();
        } else {
            $('#auth-section').removeClass('hidden');
            $('#app-section').addClass('hidden');
        }
    });

    function saveEst() {
        db.collection('establishments').add({
            name: $('#eName').val(),
            location: $('#eLoc').val()
        }).then(() => $('#estModal').modal('hide'));
    }

    function loadData() {
        db.collection('establishments').onSnapshot(snap => {
            $('#est-body').empty();
            snap.forEach(doc => {
                const d = doc.data();
                $('#est-body').append(`<tr><td>${d.name}</td><td>${d.location}</td><td><button class="btn btn-xs btn-info" onclick="window.print()">Print</button></td></tr>`);
            });
        });
    }

    function logout() { auth.signOut(); }
</script>
</body>
</html>
