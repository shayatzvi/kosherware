<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CertTracker - Bootstrap 3</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <style>
        body { padding-top: 20px; background: #f9f9f9; }
        .certificate { display: none; padding: 40px; border: 5px double #333; max-width: 600px; margin: auto; }
        @media print { .no-print { display: none !important; } .certificate { display: block; } }
    </style>
</head>
<body>

<div class="container">
    <div class="panel panel-default">
        <div class="panel-heading"><h3>Certification Manager</h3></div>
        <div class="panel-body">
            <ul class="nav nav-tabs no-print">
                <li class="active"><a data-toggle="tab" href="#estTab">Establishments</a></li>
                <li><a data-toggle="tab" href="#prodTab">Products</a></li>
            </ul>

            <div class="tab-content">
                <!-- Establishments Section -->
                <div id="estTab" class="tab-pane fade in active">
                    <br>
                    <form id="estForm" class="form-inline">
                        <input type="text" id="eName" class="form-control" placeholder="Name" required>
                        <input type="text" id="eLoc" class="form-control" placeholder="Location">
                        <input type="text" id="eStatus" class="form-control" placeholder="Status">
                        <input type="text" id="eType" class="form-control" placeholder="Kosher Type">
                        <button type="submit" class="btn btn-success">Add</button>
                    </form>
                    <br>
                    <table class="table table-bordered">
                        <thead><tr><th>Name</th><th>Location</th><th>Status</th><th>Type</th><th>Actions</th></tr></thead>
                        <tbody id="est-body"></tbody>
                    </table>
                </div>

                <!-- Products Section -->
                <div id="prodTab" class="tab-pane fade">
                    <br>
                    <form id="prodForm" class="form-inline">
                        <input type="text" id="pName" class="form-control" placeholder="Product Name" required>
                        <input type="text" id="pStatus" class="form-control" placeholder="Status">
                        <button type="submit" class="btn btn-success">Add</button>
                    </form>
                    <br>
                    <table class="table table-bordered">
                        <thead><tr><th>Product Name</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody id="prod-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Firebase Scripts -->
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAQ6srV8znv9VPXSJadwndd1r-borokbV0",
        authDomain: "lexguard-4e97d.firebaseapp.com",
        projectId: "lexguard-4e97d",
        storageBucket: "lexguard-4e97d.firebasestorage.app",
        messagingSenderId: "579400873495",
        appId: "1:579400873495:web:56f48cb7c6bd5d37bc8e52"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Add Data
    $('#estForm').submit(function(e) {
        e.preventDefault();
        db.collection('establishments').add({
            name: $('#eName').val(),
            location: $('#eLoc').val(),
            status: $('#eStatus').val(),
            kosherType: $('#eType').val()
        });
        this.reset();
    });

    $('#prodForm').submit(function(e) {
        e.preventDefault();
        db.collection('products').add({
            productName: $('#pName').val(),
            status: $('#pStatus').val()
        });
        this.reset();
    });

    // Render Tables
    function loadData(col, bodyId, isEst) {
        db.collection(col).onSnapshot(snapshot => {
            $(bodyId).empty();
            snapshot.forEach(doc => {
                const d = doc.data();
                const html = isEst ? 
                    `<tr><td>${d.name}</td><td>${d.location}</td><td>${d.status}</td><td>${d.kosherType}</td><td><button class="btn btn-xs btn-info" onclick="printCert('${d.name}')">Print</button></td></tr>` :
                    `<tr><td>${d.productName}</td><td>${d.status}</td><td><button class="btn btn-xs btn-info" onclick="printCert('${d.productName}')">Print</button></td></tr>`;
                $(bodyId).append(html);
            });
        });
    }

    function printCert(name) {
        const w = window.open();
        w.document.write(`<div class="certificate"><h2>Certificate of Kashrut</h2><p>Certified for: <strong>${name}</strong></p></div>`);
        w.print();
        w.close();
    }

    loadData('establishments', '#est-body', true);
    loadData('products', '#prod-body', false);
</script>
</body>
</html>
